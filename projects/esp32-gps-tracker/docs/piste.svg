<text x="34" y="258" text-anchor="end" font-size="12" font-weight="600" fill="#c0392b">3V3</text>
<path d="M 66 330 L 36 330" stroke="#7f8c8d" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="34" y="318" text-anchor="end" font-size="12" font-weight="600" fill="#7f8c8d">GND</text>
<text x="36" y="406" font-size="12" fill="#6b7585">due fili soli verso l&#8217;adattatore</text>
<text x="470" y="118" font-size="13" font-weight="600" fill="#1b2430">Come viene, da vicino</text>
<rect x="470" y="150" width="370" height="104" rx="8" fill="#f3efe4" stroke="#2f3b4d" stroke-width="1.5"/>
