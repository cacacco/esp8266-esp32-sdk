<text x="655" y="278" text-anchor="middle" font-size="12" fill="#6b7585">ogni piazzola saldata al filo, non solo le estremita&#8217;</text>
<rect x="470" y="300" width="370" height="48" rx="7" fill="#f6f7f9" stroke="#dfe3e8"/>
<rect x="470" y="300" width="5" height="48" rx="2" fill="#c0392b"/>
<text x="486" y="318" font-size="12.5" font-weight="600" fill="#1b2430">Sulla pista 3,3 V</text>
<text x="486" y="337" font-size="11.5" fill="#6b7585">VCC e LED del display, VCC del GPS, il + dei condensatori</text>
<rect x="470" y="358" width="370" height="48" rx="7" fill="#f6f7f9" stroke="#dfe3e8"/>
<rect x="470" y="358" width="5" height="48" rx="2" fill="#7f8c8d"/>
<text x="486" y="376" font-size="12.5" font-weight="600" fill="#1b2430">Sulla pista massa</text>
<text x="486" y="395" font-size="11.5" fill="#6b7585">GND di display e GPS, un capo del pulsante, il - dei condensatori</text>
<circle cx="76" cy="468" r="14" fill="#2f3b4d"/>
<text x="76" y="473" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">1</text>
<text x="104" y="466" font-size="13.5" font-weight="600" fill="#1b2430">Prendi un filo rigido NUDO, lungo quanto la fila.</text>
<text x="104" y="484" font-size="12" fill="#6b7585">Va benissimo una gamba tagliata di un resistore o di un condensatore.</text>
<circle cx="76" cy="514" r="14" fill="#2f3b4d"/>
<text x="76" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
<text x="104" y="512" font-size="13.5" font-weight="600" fill="#1b2430">Appoggialo sul lato rame, lungo una fila intera di piazzole.</text>
<text x="104" y="530" font-size="12" fill="#6b7585">Infila le due estremita&#8217; in due fori ai capi: cosi&#8217; sta fermo mentre saldi.</text>
<circle cx="76" cy="560" r="14" fill="#2f3b4d"/>
<text x="76" y="565" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">3</text>
<text x="104" y="558" font-size="13.5" font-weight="600" fill="#1b2430">Salda prima i due capi, controlla che sia dritto, poi tutte le piazzole.</text>
<text x="104" y="576" font-size="12" fill="#6b7585">Una per una: se ne salti una, quel foro non e&#8217; collegato a niente.</text>
<circle cx="76" cy="606" r="14" fill="#2f3b4d"/>
<text x="76" y="611" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
<text x="104" y="604" font-size="13.5" font-weight="600" fill="#1b2430">Ripeti su un&#8217;altra fila: quella e&#8217; la massa.</text>
<text x="104" y="622" font-size="12" fill="#6b7585">Lasciane una vuota in mezzo, cosi&#8217; le due piste non si toccano mai.</text>
<circle cx="76" cy="652" r="14" fill="#2f3b4d"/>
<text x="76" y="657" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">5</text>
<text x="104" y="650" font-size="13.5" font-weight="600" fill="#1b2430">Tester, prima di attaccare qualunque cosa.</text>
<text x="104" y="668" font-size="12" fill="#6b7585">Deve suonare da un capo all&#8217;altro di ogni pista, e NON deve suonare fra le due.</text>
<rect x="60" y="676" width="760" height="56" rx="8" fill="#f6f7f9" stroke="#2f3b4d" stroke-width="1"/>
<text x="80" y="700" font-size="13.5" font-weight="600" fill="#1b2430">Da qui in poi non ci pensi piu&#8217;.</text>
<text x="80" y="720" font-size="12.5" fill="#6b7585">Qualunque filo infili in un foro di quella fila e saldi e&#8217; collegato alla pista: non devi raggiungere un punto preciso.</text>
</svg>