<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="820" height="520" fill="#ffffff"/>

  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1b2430">ESP32 DevKit v1 + u-blox NEO-7M (HW-542)</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#6b7585">schema di collegamento (non e' la disposizione fisica dei pin sulla scheda)</text>

  <!-- modulo GPS -->
  <rect x="60" y="100" width="230" height="270" rx="12" fill="#eaf0f7" stroke="#2f3b4d" stroke-width="2"/>
  <rect x="60" y="100" width="230" height="38" rx="12" fill="#2f3b4d"/>
  <rect x="60" y="126" width="230" height="12" fill="#2f3b4d"/>
  <text x="175" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">GPS u-blox NEO-7M</text>
  <text x="175" y="160" text-anchor="middle" font-size="12" fill="#6b7585">antenna avvitata, vista libera del cielo</text>

  <g font-size="15" font-weight="600" fill="#1b2430" text-anchor="end">
    <text x="268" y="195">PPS</text>
    <text x="268" y="235">RXD</text>
    <text x="268" y="275">TXD</text>
    <text x="268" y="315">GND</text>
    <text x="268" y="355">VCC</text>
  </g>
  <g fill="#2f3b4d">
    <circle cx="290" cy="190" r="6"/><circle cx="290" cy="230" r="6"/><circle cx="290" cy="270" r="6"/>
    <circle cx="290" cy="310" r="6"/><circle cx="290" cy="350" r="6"/>
  </g>

  <!-- ESP32 -->
  <rect x="530" y="100" width="230" height="270" rx="12" fill="#eaf0f7" stroke="#2f3b4d" stroke-width="2"/>
  <rect x="530" y="100" width="230" height="38" rx="12" fill="#2f3b4d"/>
  <rect x="530" y="126" width="230" height="12" fill="#2f3b4d"/>
  <text x="645" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ESP32 DevKit v1</text>
  <text x="645" y="160" text-anchor="middle" font-size="12" fill="#6b7585">alimentata dalla USB</text>

  <g font-size="15" font-weight="600" fill="#1b2430" text-anchor="start">
    <text x="552" y="195">D4 / GPIO4</text>
    <text x="552" y="235">D17 / GPIO17 (TX2)</text>
    <text x="552" y="275">D16 / GPIO16 (RX2)</text>
    <text x="552" y="315">GND</text>
    <text x="552" y="355">VIN (5V)</text>
  </g>
  <g fill="#2f3b4d">
    <circle cx="530" cy="190" r="6"/><circle cx="530" cy="230" r="6"/><circle cx="530" cy="270" r="6"/>
    <circle cx="530" cy="310" r="6"/><circle cx="530" cy="350" r="6"/>
  </g>

  <!-- cavi -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M290 190 C 370 190, 450 190, 530 190" stroke="#3b7dd8" stroke-dasharray="9 7"/>
    <path d="M290 230 C 370 230, 450 230, 530 230" stroke="#2a9d4a" stroke-dasharray="9 7"/>
    <path d="M290 270 C 370 270, 450 270, 530 270" stroke="#e0a106"/>
    <path d="M290 310 C 370 310, 450 310, 530 310" stroke="#1b2430"/>
    <path d="M290 350 C 370 350, 450 350, 530 350" stroke="#d6382f"/>
  </g>

  <g font-size="12" fill="#6b7585" text-anchor="middle">
    <text x="410" y="182">1 impulso al secondo (facoltativo)</text>
    <text x="410" y="222">comandi verso il GPS (facoltativo)</text>
    <text x="410" y="262">frasi NMEA verso l'ESP32</text>
    <text x="410" y="302">massa comune</text>
    <text x="410" y="342">alimentazione</text>
  </g>

  <!-- note -->
  <rect x="60" y="398" width="700" height="100" rx="10" fill="#f6f8fb" stroke="#d7dee8"/>
  <g font-size="13" fill="#1b2430">
    <text x="78" y="422"><tspan font-weight="600">Bastano tre fili:</tspan> VCC, GND e TXD. Il filo su RXD serve solo per configurare il modulo.</text>
    <text x="78" y="444"><tspan font-weight="600">TXD del GPS va su D16</tspan>, mai sui pin dell'ESP32 marcati RX0/TX0: quelli sono la seriale USB.</text>
    <text x="78" y="466">L'ordine dei pin cambia da modulo a modulo: fidati delle sigle stampate, non della posizione.</text>
    <text x="78" y="488">VCC su <tspan font-weight="600">VIN</tspan> (5V dalla USB) o su 3V3. Le linee dati sono a 3,3 V: nessun adattatore di livello.</text>
  </g>
</svg>
