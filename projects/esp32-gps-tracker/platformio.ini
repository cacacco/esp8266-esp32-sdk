; ESP32 GPS Tracker - configurazione PlatformIO
;
;   pio run -t upload -t monitor
;
[platformio]
default_envs = esp32doit-devkit-v1

; ============================================================
; Caricamento via WiFi: pio run -e ota -t upload
; La scheda dev'essere accesa, sulla stessa rete, e avere gia' un firmware
; con ENABLE_OTA a 1 (il primo caricamento si fa per forza via USB).
; ============================================================
[env:ota]
extends      = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port  = gps-tracker.local
upload_flags = --auth=gpstracker

[env:esp32doit-devkit-v1]
platform  = espressif32@^6.9.0
board     = esp32doit-devkit-v1     ; ESP32 DevKit v1 / NodeMCU-32S (ESP32-WROOM-32)
framework = arduino

; Due spazi da 1,25 MB per il firmware piu' 1,5 MB per traccia e percorsi.
; I due spazi servono all'aggiornamento via WiFi: la scheda scrive il firmware
; nuovo in quello libero mentre sta girando con il vecchio, e al riavvio passa
; all'altro. Con una partizione sola l'OTA e' impossibile.
; Nell'Arduino IDE: Tools / Partition Scheme / "Default 4MB with spiffs".
board_build.partitions = default.csv
board_build.filesystem = littlefs

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600
; upload_port   = /dev/ttyUSB0      ; decommenta se la porta non viene rilevata

lib_deps =
  mikalhart/TinyGPSPlus@^1.0.3
  bodmer/TFT_eSPI@^2.5.43          ; serve solo con ENABLE_DISPLAY a 1
  bblanchon/ArduinoJson@^6.21.5    ; v6: SinricPro 2.x non e' compatibile con la v7
  links2004/WebSockets@^2.4.1
  sinricpro/SinricPro@^2.10.0
  ; Per usare la copia locale dell'SDK invece di quella del registro,
  ; commenta la riga sopra e decommenta questa:
  ; symlink://../..

build_flags =
  -D NODEBUG_WEBSOCKETS
  -D NDEBUG
  ; --- TFT_eSPI: display 4" ST7796 480x320 ------------------------------
  ; Configurata qui invece che modificando User_Setup.h dentro la libreria,
  ; cosi' un aggiornamento di TFT_eSPI non cancella le impostazioni.
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  ; Pin scelti fra quelli liberi e non di avvio: GPIO2 resta al LED di bordo,
  ; GPIO4 al PPS del GPS, e si evitano GPIO12/15 che decidono come parte la
  ; scheda. GPIO5 e' un pin di avvio ma come CS sta alto e non da' problemi.
  -D TFT_CS=5
  -D TFT_DC=21
  -D TFT_RST=22
  ; Il touch non viene usato: i pin T_* del pannello restano scollegati.
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  ; 27 MHz invece di 40: con i cavetti volanti e' la frequenza che regge senza
  ; sporcare lo schermo. Con il circuito stampato si puo' alzare a 40000000.
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  ; decommenta per il log completo dell'SDK SinricPro:
  ; -D ENABLE_DEBUG
